<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    --color-text-primary: #1F2933;
    --color-text-secondary: #687076;
    --color-background-primary: #FFFFFF;
    --color-background-secondary: #F4F6F8;
    --color-border-secondary: #D8DEE4;
    --color-border-tertiary: #E3E8EC;
    --border-radius-md: 8px;

    --color-primary-bg: #185FA5;
    --color-primary-text: #E6F1FB;
    --color-primary-border: #185FA5;
    --color-primary-hover: #0C447C;

    --color-danger-bg: #FCEBEB;
    --color-danger-text: #A32D2D;
    --color-danger-border: #F09595;
    --color-danger-hover: #F7C1C1;

    --color-tag-bg: #E6F1FB;
    --color-tag-text: #185FA5;

    --color-prime-bg: #E1EFF8;
    --color-prime-text: #0B4F73;
    --color-prime-border: #5B9BC4;

    --color-highlight-bg: #F3E2EE;
    --color-highlight-text: #74355B;
    --color-highlight-border: #C98DB7;

    --color-notprime-bg: #FCEEDD;
    --color-notprime-text: #8A5800;
    --color-notprime-border: #E3A856;

    --color-hist-prime-bg: #E1EFF8;
    --color-hist-prime-border: #4A87AD;
    --color-hist-prime-text: #0B4F73;

    --color-hist-cross-bg: #FCEEDD;
    --color-hist-cross-border: #C98330;
    --color-hist-cross-text: #6E4400;
  }
  [data-theme="dark"] {
    --color-text-primary: #ECEDEE;
    --color-text-secondary: #9BA1A6;
    --color-background-primary: #1E2226;
    --color-background-secondary: #16191C;
    --color-border-secondary: #3A4047;
    --color-border-tertiary: #2E343A;

    --color-primary-bg: #2B7DD6;
    --color-primary-text: #EAF4FE;
    --color-primary-border: #2B7DD6;
    --color-primary-hover: #4A93E0;

    --color-danger-bg: #3A2426;
    --color-danger-text: #FF9B9B;
    --color-danger-border: #6B3A3D;
    --color-danger-hover: #4A2E31;

    --color-tag-bg: #1B3A57;
    --color-tag-text: #8FC3F2;

    --color-prime-bg: #1B3A52;
    --color-prime-text: #8FCBEF;
    --color-prime-border: #3E7CA6;

    --color-highlight-bg: #3A2638;
    --color-highlight-text: #E2A8CE;
    --color-highlight-border: #966A89;

    --color-notprime-bg: #4A3318;
    --color-notprime-text: #F0BB73;
    --color-notprime-border: #A87A35;

    --color-hist-prime-bg: #1B3A52;
    --color-hist-prime-border: #4E8FB8;
    --color-hist-prime-text: #ABDAF5;

    --color-hist-cross-bg: #4A3318;
    --color-hist-cross-border: #C99249;
    --color-hist-cross-text: #F4D2A3;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    transition: background 0.2s, color 0.2s;
  }
  .page-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .theme-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 0.5rem; }
  #theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; font-size: 13px; border-radius: 999px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #theme-toggle:hover { background: var(--color-background-secondary); }
  #lang-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; font-size: 13px; border-radius: 999px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #lang-toggle:hover { background: var(--color-background-secondary); }
  footer { margin-top: 1.5rem; padding-top: 1rem; text-align: center; font-size: 12px; color: var(--color-text-secondary); }
  footer a { color: var(--color-text-secondary); }
</style>

<style>
  .sieve-wrap { padding: 1rem 0; font-family: var(--font-sans); }
  .sieve-header { text-align: center; margin-bottom: 1.5rem; }
  .sieve-header h2 { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 4px; }
  .sieve-header p { font-size: 13px; color: var(--color-text-secondary); margin: 0; }

  .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 1rem; }
  .controls-row button { padding: 6px 16px; font-size: 13px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; transition: background 0.15s; }
  .controls-row button:hover:not(:disabled) { background: var(--color-background-secondary); }
  .controls-row button:disabled { opacity: 0.35; cursor: default; }
  .controls-row button.primary { background: var(--color-primary-bg); color: var(--color-primary-text); border-color: var(--color-primary-border); }
  .controls-row button.primary:hover:not(:disabled) { background: var(--color-primary-hover); }
  .controls-row button.danger { background: var(--color-danger-bg); color: var(--color-danger-text); border-color: var(--color-danger-border); }
  .controls-row button.danger:hover:not(:disabled) { background: var(--color-danger-hover); }

  .settings-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 1rem; font-size: 13px; color: var(--color-text-secondary); }
  .settings-row label { display: flex; align-items: center; gap: 6px; }
  .settings-row select, .settings-row input[type=number] { border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); border-radius: var(--border-radius-md); padding: 4px 8px; font-size: 13px; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 1rem; font-size: 12px; color: var(--color-text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 3px; border: 0.5px solid var(--color-border-tertiary); flex-shrink: 0; }

  #status-bar { font-size: 13px; color: var(--color-text-secondary); background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 8px 12px; margin-bottom: 1rem; min-height: 36px; display: flex; align-items: center; gap: 8px; }
  #status-bar .tag { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--color-tag-bg); color: var(--color-tag-text); }

  .main-area { display: flex; gap: 12px; }
  .grid-wrap { flex: 1; min-width: 0; }
  #grid { display: grid; gap: 4px; }

  .num-cell { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; border-radius: 4px; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); color: var(--color-text-secondary); transition: background 0.2s, color 0.2s, border-color 0.2s; aspect-ratio: 1; cursor: default; user-select: none; }
  .num-cell.not-prime { background: var(--color-notprime-bg); color: var(--color-notprime-text); border-color: var(--color-notprime-border); text-decoration: line-through; }
  .num-cell.highlighted { background: var(--color-highlight-bg); color: var(--color-highlight-text); border-color: var(--color-highlight-border); }
  .num-cell.prime { background: var(--color-prime-bg); color: var(--color-prime-text); border-color: var(--color-prime-border); font-weight: 500; }

  .history-panel { width: 190px; flex-shrink: 0; }
  .history-panel h3 { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin: 0 0 8px; }
  #history { height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .h-item { font-size: 11px; padding: 5px 8px; border-radius: var(--border-radius-md); color: var(--color-text-primary); border-left: 3px solid; }
  .h-item.h-prime { background: var(--color-hist-prime-bg); border-color: var(--color-hist-prime-border); color: var(--color-hist-prime-text); }
  .h-item.h-cross { background: var(--color-hist-cross-bg); border-color: var(--color-hist-cross-border); color: var(--color-hist-cross-text); }
  .h-item.h-info  { background: var(--color-background-secondary); border-color: var(--color-border-secondary); color: var(--color-text-secondary); }

  .stats-row { display: flex; gap: 8px; margin-top: 1rem; }
  .stat-card { flex: 1; background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; text-align: center; }
  .stat-card .val { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .stat-card .lbl { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }

  @media (max-width: 520px) {
    .history-panel { display: none; }
    .main-area { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="page-wrap">
<div class="sieve-wrap">
  <h2 class="sr-only" data-i18n="srHeading">エラトステネスのふるい — 素数発見ツール（1〜210）</h2>
  <div class="theme-toggle-row" style="gap:8px;">
    <button id="theme-toggle" type="button" aria-label="ライトモードとダークモードを切り替え" data-i18n-aria="themeToggleAria">

      <span id="lang-toggle-label">EN</span>
    </button>
  </div>
  <div class="sieve-header">
    <h2 data-i18n="headerTitle">エラトステネスのふるい</h2>

  <div class="controls-row">

    <button id="btn-reset" class="danger" disabled data-i18n="btnReset">リセット</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-secondary);margin-left:auto;">
      <span data-i18n="speedLabel">速度</span>
      <select id="speed-sel">
        <option value="900" data-i18n="speedSlow">遅い</option>
        <option value="450" selected data-i18n="speedNormal">普通</option>
        <option value="150" data-i18n="speedFast">速い</option>

  <div class="settings-row">
    <label>
      <span data-i18n="colsLabel">列数</span>
      <input type="number" id="col-input" value="10" min="5" max="21" style="width:52px;">
    </label>
    <label>
      <span data-i18n="maxLabel">上限</span>
      <select id="max-sel">
        <option value="100">100</option>
        <option value="210" selected>210</option>
        <option value="500">500</option>

  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-background-primary)"></div><span data-i18n="legendUnchecked">未チェック</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-highlight-bg);border-color:var(--color-highlight-border)"></div><span data-i18n="legendCurrent">現在の素数</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-prime-bg);border-color:var(--color-prime-border)"></div><span data-i18n="legendPrime">素数</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-notprime-bg);border-color:var(--color-notprime-border)"></div><span data-i18n="legendNotPrime">素数でない</span></div>
  </div>

  <div id="status-bar">
    <span data-i18n="statusInitial">「開始」ボタンを押して始めてください</span>
  </div>

  <div class="main-area">
    <div class="grid-wrap">
      <div id="grid"></div>
      <div class="stats-row">
        <div class="stat-card"><div class="val" id="stat-prime">0</div><div class="lbl" data-i18n="statPrimeLabel">素数の個数</div></div>
        <div class="stat-card"><div class="val" id="stat-step">0</div><div class="lbl" data-i18n="statStepLabel">ステップ数</div></div>

  <footer data-i18n-html="footer">制作：のざたん／ <a href="https://meetupsensei.com" target="_blank" rel="noopener">meetupsensei.com</a></footer>
</div>
</div>

<script>
const SIEVE_I18N = {
  ja: {
    pageTitle: 'エラトステネスのふるい — 素数発見ツール',
    srHeading: 'エラトステネスのふるい — 素数発見ツール（1〜210）',
    themeToggleAria: 'ライトモードとダークモードを切り替え',
    themeToggleLabelLight: 'ダークモード',
    themeToggleLabelDark: 'ライトモード',
    langToggleAria: '言語を切り替え',
    headerTitle: 'エラトステネスのふるい',
    headerSubtitle: '素数を見つけ出す視覚的なアルゴリズム',
    btnStart: '開始',
    btnNext: '次のステップ',
    btnAutoStart: '自動実行',
    btnAutoStop: '停止',
    btnReset: 'リセット',
    speedLabel: '速度',
    speedSlow: '遅い', speedNormal: '普通', speedFast: '速い', speedSuper: '超速',
    colsLabel: '列数', maxLabel: '上限',
    legendUnchecked: '未チェック', legendCurrent: '現在の素数', legendPrime: '素数', legendNotPrime: '素数でない',
    statusInitial: '「開始」ボタンを押して始めてください',
    statPrimeLabel: '素数の個数', statStepLabel: 'ステップ数',
    historyTitle: 'ステップ履歴', historyEmpty: '履歴はここに表示されます',
    tagComplete: '完了',
    statusFound: n => `素数 ${n} を発見`,
    statusCrossing: n => `${n} の倍数を消していきます`,
    statusComplete: (max, count) => `完了！1〜${max}の素数は ${count} 個`,
    histStart: '開始',
    histAutoStart: '自動実行を開始',
    histIsPrime: n => `${n} は素数`,
    histCandidate: n => `候補: ${n}`,
    histRemoveAllMultiples: n => `${n} の倍数をすべて除去`,
    histRemove: (m, base, idx) => `${m} を除去 (${base}×${idx})`,
    histRemainingPrimes: list => `残りの素数をマーク: ${list}`,
    histComplete: count => `完了: 素数 ${count} 個`,
    footer: '制作：のざたん／ <a href="https://meetupsensei.com" target="_blank" rel="noopener">meetupsensei.com</a>'
  },
  en: {
    pageTitle: 'Sieve of Eratosthenes — Prime Number Finder',
    srHeading: 'Sieve of Eratosthenes — Prime Number Finder (1–210)',
    themeToggleAria: 'Toggle light and dark mode',
    themeToggleLabelLight: 'Dark mode',
    themeToggleLabelDark: 'Light mode',
    langToggleAria: 'Switch language',
    headerTitle: 'Sieve of Eratosthenes',
    headerSubtitle: 'A visual algorithm for finding prime numbers',
    btnStart: 'Start',
    btnNext: 'Next step',
    btnAutoStart: 'Auto run',
    btnAutoStop: 'Stop',
    btnReset: 'Reset',
    speedLabel: 'Speed',
    speedSlow: 'Slow', speedNormal: 'Normal', speedFast: 'Fast', speedSuper: 'Super fast',
    colsLabel: 'Columns', maxLabel: 'Max',
    legendUnchecked: 'Unchecked', legendCurrent: 'Current prime', legendPrime: 'Prime', legendNotPrime: 'Not prime',
    statusInitial: 'Press "Start" to begin',
    statPrimeLabel: 'Primes found', statStepLabel: 'Steps',
    historyTitle: 'Step history', historyEmpty: 'History will appear here',
    tagComplete: 'Done',
    statusFound: n => `Found prime ${n}`,
    statusCrossing: n => `Crossing out multiples of ${n}`,
    statusComplete: (max, count) => `Done! There are ${count} primes between 1 and ${max}`,
    histStart: 'Start',
    histAutoStart: 'Started auto run',
    histIsPrime: n => `${n} is prime`,
    histCandidate: n => `Candidate: ${n}`,
    histRemoveAllMultiples: n => `Removed all multiples of ${n}`,
    histRemove: (m, base, idx) => `Removed ${m} (${base}×${idx})`,
    histRemainingPrimes: list => `Marked remaining primes: ${list}`,
    histComplete: count => `Done: ${count} primes`,
    footer: 'Created by Nozatan / <a href="https://meetupsensei.com" target="_blank" rel="noopener">meetupsensei.com</a>'
  }
};
let sieveLang = 'ja';
function st(key, ...args) {
  const v = SIEVE_I18N[sieveLang][key];
  return typeof v === 'function' ? v(...args) : v;
}
function applySieveLang() {
  document.documentElement.lang = sieveLang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = st(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', st(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = st(el.dataset.i18nHtml); });
  document.getElementById('lang-toggle-label').textContent = sieveLang === 'ja' ? 'EN' : 'JA';
  const themeLabel = document.getElementById('theme-toggle-label');
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeLabel.textContent = isDark ? st('themeToggleLabelDark') : st('themeToggleLabelLight');
  if (window.sieveRefreshDynamic) window.sieveRefreshDynamic();
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('lang-toggle').addEventListener('click', () => {
    sieveLang = sieveLang === 'ja' ? 'en' : 'ja';
    applySieveLang();
  });
});
</script>
<script>
(function(){
  const STORAGE_KEY = 'eratosthenes-sieve-theme';
  const root = document.documentElement;
  const toggleBtn = document.getElementById('theme-toggle');
  const toggleIcon = document.getElementById('theme-toggle-icon');
  const toggleLabel = document.getElementById('theme-toggle-label');

  function applyTheme(theme) {
    if (theme === 'dark') {
      root.setAttribute('data-theme', 'dark');
      toggleIcon.textContent = '☀️';
      toggleLabel.textContent = st('themeToggleLabelDark');
    } else {
      root.removeAttribute('data-theme');
      toggleIcon.textContent = '🌙';
      toggleLabel.textContent = st('themeToggleLabelLight');
    }
  }

  function getInitialTheme() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  let currentTheme = getInitialTheme();
  applyTheme(currentTheme);

  toggleBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(currentTheme);
    localStorage.setItem(STORAGE_KEY, currentTheme);
  });

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem(STORAGE_KEY)) {
        currentTheme = e.matches ? 'dark' : 'light';
        applyTheme(currentTheme);
      }
    });
  }
})();

(function(){
  const gridEl = document.getElementById('grid');
  const histEl = document.getElementById('history');
  const statusEl = document.getElementById('status-bar');
  const statPrime = document.getElementById('stat-prime');
  const statStep = document.getElementById('stat-step');
  const colInput = document.getElementById('col-input');
  const maxSel = document.getElementById('max-sel');
  const speedSel = document.getElementById('speed-sel');
  const btnStart = document.getElementById('btn-start');
  const btnNext = document.getElementById('btn-next');
  const btnAuto = document.getElementById('btn-auto');
  const btnReset = document.getElementById('btn-reset');

  let MAX = 210, COLS = 10;
  let nums = [], started = false, autoRunning = false, timer = null;
  let currentPrime = 1, primeCount = 0, stepCount = 0;
  let phase = 'find'; // 'find' | 'cross'
  let crossIdx = 0;
  let statusKind = 'initial', statusArg = null;

  function setStatus(msg, tag) {
    statusEl.innerHTML = (tag ? `<span class="tag">${tag}</span>` : '') + `<span>${msg}</span>`;
  }

  function renderStatus() {
    if (statusKind === 'initial') setStatus(st('statusInitial'));
    else if (statusKind === 'found') setStatus(st('statusFound', statusArg), statusArg.toString());
    else if (statusKind === 'crossing') setStatus(st('statusCrossing', statusArg), statusArg.toString());
    else if (statusKind === 'complete') setStatus(st('statusComplete', MAX, statusArg), st('tagComplete'));
  }
  window.sieveRefreshDynamic = function(){
    renderStatus();
    btnAuto.textContent = autoRunning ? st('btnAutoStop') : st('btnAutoStart');
  };

  function addHistory(msg, type) {
    if (histEl.querySelector('.h-info') && histEl.children.length === 1) histEl.innerHTML = '';
    const d = document.createElement('div');
    d.className = `h-item h-${type}`;
    d.textContent = msg;
    histEl.appendChild(d);
    histEl.scrollTop = histEl.scrollHeight;
  }

  function buildGrid() {
    gridEl.innerHTML = '';
    nums = [];
    gridEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
    for (let i = 1; i <= MAX; i++) {
      const el = document.createElement('div');
      el.className = 'num-cell' + (i === 1 ? ' not-prime' : '');
      el.textContent = i;
      gridEl.appendChild(el);
      nums.push({ n: i, el, crossed: i === 1, prime: false });
    }
  }

  function findNextUncrossed(from) {
    return nums.find(o => o.n >= from && !o.crossed && !o.prime);
  }

  function markCurrentPrime() {
    const obj = nums[currentPrime - 1];
    obj.el.classList.remove('highlighted');
    obj.el.classList.add('prime');
    obj.prime = true;
    primeCount++;
    statPrime.textContent = primeCount;
    stepCount++;
    statStep.textContent = stepCount;
    addHistory(st('histIsPrime', currentPrime), 'prime');
    statusKind = 'crossing'; statusArg = currentPrime;
    setStatus(st('statusCrossing', currentPrime), currentPrime.toString());
    crossIdx = 2;
    phase = 'cross';
  }

  function crossStep() {
    const m = currentPrime * crossIdx;
    if (m > MAX) {
      addHistory(st('histRemoveAllMultiples', currentPrime), 'info');
      stepCount++;
      statStep.textContent = stepCount;
      phase = 'find';
      findAndHighlight();
      return;
    }
    const obj = nums[m - 1];
    if (obj && !obj.crossed && !obj.prime) {
      obj.el.classList.add('not-prime');
      obj.crossed = true;
      addHistory(st('histRemove', m, currentPrime, crossIdx), 'cross');
    }
    crossIdx++;
    stepCount++;
    statStep.textContent = stepCount;
  }

  function findAndHighlight() {
    const next = findNextUncrossed(currentPrime + (phase === 'find' ? 1 : 0));
    if (!next) { finish(); return; }
    currentPrime = next.n;
    next.el.classList.add('highlighted');
    statusKind = 'found'; statusArg = currentPrime;
    setStatus(st('statusFound', currentPrime), currentPrime.toString());
    addHistory(st('histCandidate', currentPrime), 'prime');
    phase = 'find';
  }

  function processStep() {
    if (phase === 'find') {
      markCurrentPrime();
    } else {
      crossStep();
    }
    if (currentPrime > Math.sqrt(MAX) && phase === 'find') {
      markRemainingPrimes();
    }
  }

  function markRemainingPrimes() {
    let more = [];
    nums.forEach(o => {
      if (!o.crossed && !o.prime && o.n > 1) {
        o.el.classList.remove('highlighted');
        o.el.classList.add('prime');
        o.prime = true;
        primeCount++;
        more.push(o.n);
      }
    });
    if (more.length) {
      statPrime.textContent = primeCount;
      addHistory(st('histRemainingPrimes', more.join(', ')), 'prime');
      finish();
    }
  }

  function finish() {
    stopAuto();
    btnNext.disabled = true;
    btnAuto.disabled = true;
    statusKind = 'complete'; statusArg = primeCount;
    setStatus(st('statusComplete', MAX, primeCount), st('tagComplete'));
    addHistory(st('histComplete', primeCount), 'info');
  }

  function startAuto() {
    autoRunning = true;
    btnAuto.textContent = st('btnAutoStop');
    btnAuto.classList.add('danger');
    btnNext.disabled = true;
    addHistory(st('histAutoStart'), 'info');
    const spd = parseInt(speedSel.value);
    timer = setInterval(processStep, spd);
  }

  function stopAuto() {
    if (!autoRunning) return;
    autoRunning = false;
    clearInterval(timer); timer = null;
    btnAuto.textContent = st('btnAutoStart');
    btnAuto.classList.remove('danger');
    btnNext.disabled = false;
  }

  function reset() {
    stopAuto();
    started = false; currentPrime = 1; primeCount = 0; stepCount = 0; phase = 'find'; crossIdx = 0;
    statPrime.textContent = 0; statStep.textContent = 0;
    btnStart.disabled = false; btnNext.disabled = true; btnAuto.disabled = true; btnReset.disabled = true;
    histEl.innerHTML = `<div class="h-item h-info">${st('historyEmpty')}</div>`;
    statusKind = 'initial'; statusArg = null;
    setStatus(st('statusInitial'));
    MAX = parseInt(maxSel.value);
    COLS = parseInt(colInput.value) || 10;
    buildGrid();
  }

  btnStart.addEventListener('click', () => {
    started = true;
    btnStart.disabled = true;
    btnNext.disabled = false;
    btnAuto.disabled = false;
    btnReset.disabled = false;
    addHistory(st('histStart'), 'info');
    findAndHighlight();
  });

  btnNext.addEventListener('click', () => { if (started) processStep(); });
  btnAuto.addEventListener('click', () => { autoRunning ? stopAuto() : startAuto(); });
  btnReset.addEventListener('click', reset);

  colInput.addEventListener('change', () => { if (!started) { COLS = parseInt(colInput.value)||10; buildGrid(); } });
  maxSel.addEventListener('change', () => { if (!started) { MAX = parseInt(maxSel.value); buildGrid(); } });
  speedSel.addEventListener('change', () => { if (autoRunning) { stopAuto(); startAuto(); } });

  MAX = parseInt(maxSel.value);
  COLS = parseInt(colInput.value);
  buildGrid();
})();
</script>
</body>
</html>
